<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Resume · VARS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anek+Latin:wdth,wght@75..125,300..800&family=Doto:wght@500..900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/vars.css?v={{ v }}">
  <link rel="stylesheet" href="/static/css/build.css?v={{ v }}">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <symbol id="i-print" viewBox="0 0 20 20"><path d="M5.5 7.5V3h9v4.5M5.5 14H3.5V7.5h13V14h-2M5.5 11.5h9V17h-9z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></symbol>
  <symbol id="i-edit" viewBox="0 0 20 20"><path d="M12.5 4 16 7.5 7.5 16H4v-3.5zM10.5 6l3.5 3.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></symbol>
  <symbol id="i-arrow" viewBox="0 0 20 20"><path d="M16 10H5M9 5.5 4.5 10 9 14.5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-check" viewBox="0 0 20 20"><path d="M4 10.5l4 4 8-9" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-x" viewBox="0 0 20 20"><path d="M5 5l10 10M15 5 5 15" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></symbol>
</defs></svg>
<div class="print-wrap">
  <div class="print-bar no-print" id="bar"></div>
  <div id="doc"></div>
</div>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>
<script type="module">
  import { store } from "/static/js/core/store.js?v={{ v }}";
  import { h, icon, mount, toast } from "/static/js/core/ui.js?v={{ v }}";
  import { renderCV, collectEdits } from "/static/js/core/cv.js?v={{ v }}";
  const doc = document.getElementById("doc");
  const bar = document.getElementById("bar");
  let editing = false;
  function paint() {
    const r = store.get("voice")?.resume || null;
    document.title = r?.name ? `${r.name} · Resume` : "Resume · VARS";
    mount(doc, renderCV(r, { editable: editing }));
    mount(bar,
      h("a", { class: "btn ghost", href: "/build" }, icon("arrow"), "Back to Build by voice"),
      h("span", { class: "grow" }),
      editing
        ? h("button", { class: "btn secondary", type: "button", onclick: () => { const data = collectEdits(doc, r); store.set("voice", { ...(store.get("voice") || {}), resume: data }); editing = false; paint(); toast("Edits saved in this tab.", "ok"); } }, icon("check"), "Save edits")
        : h("button", { class: "btn secondary", type: "button", disabled: !r, onclick: () => { editing = true; paint(); } }, icon("edit"), "Edit text"),
      h("button", { class: "btn", type: "button", disabled: !r, onclick: () => window.print() }, icon("print"), "Print or save as PDF"));
  }
  paint();
</script>
</body>
</html>
