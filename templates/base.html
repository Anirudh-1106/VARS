<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1C4A9C">
  <meta name="description" content="VARS is a placement coach: resume scoring with line-by-line fixes, role fit, and mock technical, coding and HR interviews. Nothing is stored on the server.">
  <title>{% if page != 'home' %}{{ title }} · {% endif %}VARS</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='4' fill='%231C4A9C'/%3E%3Cg fill='%23fff'%3E%3Ccircle cx='9' cy='10' r='2'/%3E%3Ccircle cx='9' cy='16' r='2'/%3E%3Ccircle cx='12' cy='22' r='2'/%3E%3Ccircle cx='16' cy='26' r='2'/%3E%3Ccircle cx='20' cy='22' r='2'/%3E%3Ccircle cx='23' cy='16' r='2'/%3E%3Ccircle cx='23' cy='10' r='2'/%3E%3C/g%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anek+Latin:wdth,wght@75..125,300..800&family=Doto:wght@500..900&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/vars.css?v={{ v }}">
  {% block head %}{% endblock %}
</head>
<body data-page="{{ page }}">
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-home" viewBox="0 0 20 20"><path d="M3 9.2 10 3l7 6.2V17H12.5v-4.5h-5V17H3z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></symbol>
    <symbol id="i-doc" viewBox="0 0 20 20"><path d="M5 2.5h6.5L15.5 6.5V17.5H5z M11.5 2.5v4h4 M7.5 10h5 M7.5 13h5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></symbol>
    <symbol id="i-mic" viewBox="0 0 20 20"><rect x="7" y="2.5" width="6" height="10" rx="3" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M4.5 9.5a5.5 5.5 0 0 0 11 0M10 15v2.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
    <symbol id="i-person" viewBox="0 0 20 20"><circle cx="10" cy="6.8" r="3.6" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M3.5 17.5c.9-3.6 3.5-5 6.5-5s5.6 1.4 6.5 5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
    <symbol id="i-chart" viewBox="0 0 20 20"><path d="M4 2.5h12v15H4z M7 7h6 M7 10h6 M7 13h3.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><circle cx="14" cy="13.5" r=".9" fill="currentColor"/></symbol>
    <symbol id="i-cell" viewBox="0 0 20 20"><path d="M2 8 10 3.5 18 8 10 12.5z M5 9.8v4c3 2.2 7 2.2 10 0v-4 M18 8v5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/></symbol>
    <symbol id="i-upload" viewBox="0 0 20 20"><path d="M10 13V3.5M6 7l4-4 4 4M3.5 13v3.5h13V13" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-lock" viewBox="0 0 20 20"><rect x="4" y="9" width="12" height="8.5" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M6.8 9V6.3a3.2 3.2 0 0 1 6.4 0V9" fill="none" stroke="currentColor" stroke-width="1.6"/></symbol>
    <symbol id="i-trash" viewBox="0 0 20 20"><path d="M3.5 5.5h13M8 5.5V3.5h4v2M5.5 5.5l.8 11.5h7.4l.8-11.5M8.5 8.5v5.5M11.5 8.5v5.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-play" viewBox="0 0 20 20"><path d="M6 4l10 6-10 6z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></symbol>
    <symbol id="i-stop" viewBox="0 0 20 20"><rect x="5" y="5" width="10" height="10" rx="1.5" fill="currentColor"/></symbol>
    <symbol id="i-send" viewBox="0 0 20 20"><path d="M3 10h12M10.5 5l5 5-5 5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-check" viewBox="0 0 20 20"><path d="M4 10.5l4 4 8-9" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-x" viewBox="0 0 20 20"><path d="M5 5l10 10M15 5 5 15" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 20 20"><path d="M16 10a6 6 0 1 1-1.8-4.3M16 3.5v3.2h-3.2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-copy" viewBox="0 0 20 20"><rect x="7" y="7" width="10" height="10" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M13 7V4.5A1.5 1.5 0 0 0 11.5 3h-7A1.5 1.5 0 0 0 3 4.5v7A1.5 1.5 0 0 0 4.5 13H7" fill="none" stroke="currentColor" stroke-width="1.6"/></symbol>
    <symbol id="i-download" viewBox="0 0 20 20"><path d="M10 3v10M6 9l4 4 4-4M3.5 13.5V17h13v-3.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-camera" viewBox="0 0 20 20"><rect x="2.5" y="5.5" width="11" height="9" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M13.5 9 17.5 6.5v7L13.5 11" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></symbol>
    <symbol id="i-camera-off" viewBox="0 0 20 20"><path d="M2.5 7v6a1.5 1.5 0 0 0 1.5 1.5h8M13.5 11.5V7A1.5 1.5 0 0 0 12 5.5H7M13.5 9l4-2.5v7l-4-2.5M3 3l14 14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-cc" viewBox="0 0 20 20"><rect x="2.5" y="4.5" width="15" height="11" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M8.6 8.4a2 2 0 1 0 0 3.2M14.2 8.4a2 2 0 1 0 0 3.2" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></symbol>
    <symbol id="i-keyboard" viewBox="0 0 20 20"><rect x="2" y="5" width="16" height="10" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M5 8.2h.01M8 8.2h.01M11 8.2h.01M14 8.2h.01M6.5 12h7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="i-code" viewBox="0 0 20 20"><path d="M7 6 3 10l4 4M13 6l4 4-4 4M11.2 4.5 8.8 15.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-clock" viewBox="0 0 20 20"><circle cx="10" cy="10" r="7" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M10 6v4.3l2.8 1.7" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
    <symbol id="i-link" viewBox="0 0 20 20"><path d="M8.5 11.5a3.2 3.2 0 0 0 4.6 0l2.6-2.6a3.2 3.2 0 0 0-4.6-4.6l-1 1M11.5 8.5a3.2 3.2 0 0 0-4.6 0l-2.6 2.6a3.2 3.2 0 0 0 4.6 4.6l1-1" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
    <symbol id="i-end" viewBox="0 0 20 20"><path d="M3 11.5c3.8-3.4 10.2-3.4 14 0l-1.6 2.2-3-1.2v-2c-1.6-.5-3.2-.5-4.8 0v2l-3 1.2z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></symbol>
    <symbol id="i-volume" viewBox="0 0 20 20"><path d="M3 8v4h3l4 3.5v-11L6 8z M13 7.5a3.5 3.5 0 0 1 0 5M15 5.5a6.3 6.3 0 0 1 0 9" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 20 20"><path d="M4 10h11M11 5.5l4.5 4.5L11 14.5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-info" viewBox="0 0 20 20"><circle cx="10" cy="10" r="7.2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M10 9v5M10 6.3v.2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="i-warn" viewBox="0 0 20 20"><path d="M10 3 18 16.5H2z M10 8v4M10 14.2v.2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/></symbol>
    <symbol id="i-edit" viewBox="0 0 20 20"><path d="M12.5 4 16 7.5 7.5 16H4v-3.5zM10.5 6l3.5 3.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></symbol>
    <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="i-print" viewBox="0 0 20 20"><path d="M5.5 7.5V3h9v4.5M5.5 14H3.5V7.5h13V14h-2M5.5 11.5h9V17h-9z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></symbol>
    <symbol id="i-skip" viewBox="0 0 20 20"><path d="M4 5l7 5-7 5zM15 5v10" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/></symbol>
    <symbol id="i-chat" viewBox="0 0 20 20"><path d="M3 4.5h14v9H8.5L5 16.5v-3H3z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></symbol>
    <symbol id="i-target" viewBox="0 0 20 20"><circle cx="10" cy="10" r="7" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="10" cy="10" r="3.4" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="10" cy="10" r=".9" fill="currentColor"/></symbol>
    <symbol id="i-shield" viewBox="0 0 20 20"><path d="M10 2.5 16 5v5c0 3.6-2.6 6.3-6 7.5C6.6 16.3 4 13.6 4 10V5z M7.2 10l2 2 3.8-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/></symbol>
  </defs>
</svg>
<div class="shell">
  <header class="rail" id="rail">
    <a class="brand" href="/" aria-label="VARS home"><b>VARS</b><span>Placement coach</span></a>
    <button class="menu-btn" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="nav"><svg><use href="#i-menu"/></svg></button>
    <nav class="nav" id="nav" aria-label="Main">
      <a href="/" {% if page=='home' %}aria-current="page"{% endif %}><svg><use href="#i-home"/></svg>Home</a>
      <a href="/studio" {% if page=='studio' %}aria-current="page"{% endif %}><svg><use href="#i-doc"/></svg>Resume Studio<span class="tag" data-nav-status="studio" hidden></span></a>
      <a href="/build" {% if page=='build' %}aria-current="page"{% endif %}><svg><use href="#i-mic"/></svg>Build by voice</a>
      <a href="/interview" {% if page=='interview' %}aria-current="page"{% endif %}><svg><use href="#i-person"/></svg>Mock interview</a>
      <a href="/report" {% if page=='report' %}aria-current="page"{% endif %}><svg><use href="#i-chart"/></svg>Report<span class="tag" data-nav-status="report" hidden></span></a>
      <a href="/cell" {% if page=='cell' %}aria-current="page"{% endif %}><svg><use href="#i-cell"/></svg>Placement cell</a>
    </nav>
    <div class="rail-foot">
      <p>Nothing you add is stored on our server. Close this tab and it is gone.</p>
      <button type="button" data-clear-session><svg><use href="#i-trash"/></svg>Clear this session now</button>
    </div>
  </header>
  <main class="work" id="main">
    {% block main %}{% endblock %}
  </main>
</div>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>
<script type="module" src="/static/js/core/shell.js?v={{ v }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
